services:
  - type: web
    name: hronika
    runtime: node
    # Starter, а не free: на бесплатном тарифе диск не подключается, и база
    # с перепиской обнулялась бы при каждом перезапуске.
    plan: starter
    region: frankfurt
    branch: main

    # --include=dev у фронтенда обязателен: NODE_ENV=production ниже действует
    # и во время сборки, а в этом режиме npm ci молча пропускает
    # devDependencies — вместе с typescript и vite, без которых сборка падает.
    # Серверу это не нужно: все его зависимости рабочие.
    buildCommand: cd server && npm ci && cd ../web && npm ci --include=dev && npm run build
    startCommand: node server/src/index.js
    healthCheckPath: /

    # Постоянный диск. База и загруженные файлы лежат здесь, а не рядом с
    # кодом — код перезаписывается при каждом деплое, диск переживает их все.
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        # Переключает куку сессии в secure — по HTTP она больше не уйдёт.
        value: production
      - key: DATA_DIR
        value: /var/data
      # Секрет: в репозитории его нет, Render спросит значение при создании
      # сервиса. Можно оставить пустым — тогда письма сброса пароля печатаются
      # в лог сервиса, а не уходят на почту.
      - key: RESEND_API_KEY
        sync: false
      # Вход по номеру: SMS платные — провайдер подключается вашим аккаунтом.
      # twilio или smsru; Render спросит значения при создании сервиса. Пустые —
      # вход по номеру ответит «не настроен», а старые аккаунты войдут по логину.
      - key: SMS_PROVIDER
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: SMSRU_API_ID
        sync: false
      # Необязательно: TURN-сервер для звонков через строгие сети (см. README).
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
