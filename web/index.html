<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Хроника</title>
    <meta name="description" content="Текстовая социальная сеть: профили, лента, посты." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;900&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap"
      rel="stylesheet"
    />
    <!-- Тема применяется ДО первой отрисовки, иначе при загрузке тёмной
         страница успевает моргнуть светлым. Ключ и значения — те же, что в
         src/theme.ts; «auto» атрибута не ставит, дальше решает медиазапрос
         prefers-color-scheme в styles/tokens.css. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('chronicle-theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {
          /* хранилище запрещено — остаётся системная тема */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
