name: Демо на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Разрешения нужны самому деплою Pages, а не коду сборки.
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои Pages конфликтуют между собой; берём последний,
# но не обрываем уже идущую выкладку на полпути.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Тесты — до сборки: сломанная витрина не должна уехать на Pages.
      - name: Тесты интерфейса и витрины
        run: npm test

      - name: Сборка витрины
        run: npm run build:demo

      # Pages не умеет отдавать index.html на произвольный путь, поэтому
      # прямая ссылка на /messages вернула бы 404. Копия index.html под
      # именем 404.html превращает этот 404 в то же приложение, и роутер
      # разбирает адрес уже сам.
      - name: Заглушка для прямых ссылок
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
